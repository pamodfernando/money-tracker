<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Money">
<meta name="theme-color" content="#0f4c5c">
<title>My Money</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f6;--card:#fff;--ink:#14272d;--mute:#6a7f86;--line:#e2eaec;--acc:#0f766e;--on:#fff;--exp:#d6513a;--inc:#12805c;--sh:0 4px 16px rgba(20,39,45,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1517;--card:#142126;--ink:#e6f0f1;--mute:#86a0a6;--line:#223439;--acc:#4fd1c0;--on:#06201d;--exp:#ff8a72;--inc:#4fd1a1;--sh:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Schibsted Grotesk",system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
main{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
section{display:none}section.on{display:block}
h1{font-size:24px;margin:12px 0}
h2{font-size:15px;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-weight:400;color:var(--mute);font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin-top:14px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
input:focus{outline:none;border-color:var(--acc)}
#amt{font-size:34px;font-weight:800}
.hero{background:linear-gradient(135deg,#0f4c5c,#1b998b);color:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh)}
.hero small{opacity:.8;display:block;font-size:13px}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:2px}
.pills{display:flex;gap:10px;margin-top:14px}
.pills div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.pills b{font-size:17px}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:700;padding:11px;border-radius:11px;color:var(--mute)}
.seg .on{background:var(--acc);color:var(--on)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:8px 13px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.primary,.ghost{width:100%;font:inherit;font-weight:700;border-radius:14px;padding:15px;margin-top:16px;border:0}
.primary{background:var(--acc);color:var(--on)}
.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink);margin-top:10px}
.danger{color:var(--exp)}
.back{font:inherit;font-weight:700;color:var(--acc);background:none;border:0;padding:8px 0}
ul{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border:0}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-style:normal;font-weight:800;flex:none}
.t{flex:1;min-width:0}
.t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li>span{font-weight:800;white-space:nowrap}
.expense{color:var(--exp)}.income{color:var(--inc)}
.empty{color:var(--mute);text-align:center;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .panel{margin-top:0}
.panel small{display:block;color:var(--mute)}
.panel b{font-size:20px}
.bar{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar.over i{background:var(--exp)}
.row{margin-top:14px}.row div:first-child{display:flex;justify-content:space-between;font-size:14px}
.mnav{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}
.mnav button{font:inherit;font-size:20px;border:0;background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:40px;box-shadow:var(--sh)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);box-shadow:0 -4px 16px rgba(20,39,45,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:700;color:var(--mute);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;filter:grayscale(1);opacity:.6}
nav .on{color:var(--acc)}nav .on span{filter:none;opacity:1}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main>
  <section id="v-add"></section><section id="v-over"></section><section id="v-ppl"></section><section id="v-hist"></section><section id="v-set"></section>
</main>
<nav>
  <button data-v="add" onclick="setView('add')"><span>➕</span>Add</button>
  <button data-v="over" onclick="setView('over')"><span>📊</span>Overview</button>
  <button data-v="ppl" onclick="setView('ppl')"><span>👥</span>People</button>
  <button data-v="hist" onclick="setView('hist')"><span>🧾</span>History</button>
  <button data-v="set" onclick="setView('set')"><span>⚙️</span>Settings</button>
</nav>
<div id="toast"></div>
<script>
// Edit these lists to change categories: name:[emoji,color]
const CAT={
 expense:{Food:["🍽️","#e76f51"],Transport:["🚌","#3a86ff"],Bills:["💡","#f4a261"],Shopping:["🛍️","#c77dff"],Health:["💊","#2ec4b6"],Fun:["🎬","#ef476f"],Other:["📦","#8d99ae"]},
 income:{Bonus:["💼","#12805c"],Business:["🏪","#3a86ff"],Gift:["🎁","#ef476f"],Other:["💰","#f4a261"]}};
const KEY="mymoney.v1",PAL=["#e76f51","#3a86ff","#f4a261","#c77dff","#2ec4b6","#ef476f","#8d99ae","#06a77d"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const two=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())};
const money=n=>Number(n).toLocaleString("en-LK",{minimumFractionDigits:2,maximumFractionDigits:2});
const shift=(m,d)=>{const [y,mo]=m.split("-").map(Number),x=new Date(y,mo-1+d,1);return x.getFullYear()+"-"+two(x.getMonth()+1)};
const mname=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})};
const sum=(r,t)=>r.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);
const ic=x=>(CAT[x.type]||{})[x.cat]||["📌","#8d99ae"];
const key=s=>(s||"").trim().toLowerCase();
const pcol=s=>PAL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
const blank=(t,date)=>({type:t,cat:Object.keys(CAT[t])[0],editId:null,amt:"",who:"",note:"",date:date||today()});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.tx))return{tx:d.tx,set:d.set||{}}}catch(e){}return{tx:[],set:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Could not save. Browser storage is blocked or full.")}}
let db=load(),view="add",month=today().slice(0,7),form=blank("expense"),sel=null,pl=[],tm;
const cur=()=>db.set.cur||"LKR";
const curM=()=>today().slice(0,7);
const startM=()=>db.set.start||curM();
const monthsFrom=(a,b)=>{const [y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);return Math.max(0,(y2-y1)*12+m2-m1+1)};
const salOf=m=>(+db.set.salary>0&&m>=startM()&&m<=curM())?+db.set.salary:0;
const incOf=m=>salOf(m)+sum(db.tx.filter(x=>x.date.startsWith(m)),"income");
const totalMoney=()=>(+db.set.opening||0)+(+db.set.salary>0?monthsFrom(startM(),curM())*db.set.salary:0)+sum(db.tx,"income")-sum(db.tx,"expense");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tm);tm=setTimeout(()=>t.classList.remove("show"),1800)}
function draft(){const a=$("#amt");if(a){form.amt=a.value;form.who=$("#who").value;form.note=$("#note").value;form.date=$("#date").value}}
function setView(v){if(view==="add")draft();view=v;if(v==="ppl")sel=null;render();scrollTo(0,0)}
function render(){
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="v-"+view));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  ({add:rAdd,over:rOver,ppl:rPeople,hist:rHist,set:rSet})[view]();
}
const item=x=>{const [e,c]=ic(x);return`<li onclick="edit('${x.id}')"><i class="av" style="background:${c}26">${e}</i><div class="t"><b>${esc(x.who||x.note||x.cat)}</b><small>${esc(x.cat+(x.who&&x.note?", "+x.note:""))}</small></div><span class="${x.type}">${x.type==="expense"?"-":"+"} ${money(x.amount)}</span></li>`};
const list=rows=>rows.length?`<ul>${[...rows].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).map(item).join("")}</ul>`:`<p class="empty">Nothing here yet.</p>`;

/* ---------- Add ---------- */
function rAdd(){
  const f=form,tt=db.tx.filter(x=>x.date===today());
  const names=[...new Map(db.tx.filter(x=>x.who).map(x=>[key(x.who),x.who])).values()];
  const tdy=today(),cm=tdy.slice(0,7),[Y,M]=cm.split("-").map(Number),dimN=new Date(Y,M,0).getDate(),dn=new Date().getDate();
  const goal=+db.set.saveGoal||0,base=incOf(cm)-goal,hasPlan=salOf(cm)>0||goal>0;
  const before=sum(db.tx.filter(x=>x.date.startsWith(cm)&&x.date<tdy),"expense"),spentT=sum(tt,"expense");
  const allow=(base-before)/(dimN-dn+1),leftT=allow-spentT;
  const hero=hasPlan?`<div class="hero"><small>${leftT<0?"Over today's allowance by":"Left to spend today"}</small><div class="big">${esc(cur())} ${money(Math.abs(leftT))}</div><div class="pills"><div><small>Today's allowance</small><b>${money(Math.max(allow,0))}</b></div><div><small>Spent today</small><b>${money(spentT)}</b></div></div></div>`:`<div class="hero"><small>Spent today</small><div class="big">${esc(cur())} ${money(spentT)}</div><small style="margin-top:8px">Add your salary and savings goal in Settings to see your daily allowance.</small></div>`;
  $("#v-add").innerHTML=`${hero}
  <div class="panel">
  <div class="seg"><button class="${f.type==="expense"?"on":""}" onclick="setType('expense')">Expense</button><button class="${f.type==="income"?"on":""}" onclick="setType('income')">Income</button></div>
  <label>Amount (${esc(cur())})<input id="amt" inputmode="decimal" placeholder="0.00" value="${esc(f.amt)}" onkeydown="event.key==='Enter'&&saveTx()"></label>
  <label>${f.type==="expense"?"Paid to":"Received from"}<input id="who" list="wl" maxlength="40" placeholder="Shop, person or company" value="${esc(f.who)}" onchange="whoPick()" onkeydown="event.key==='Enter'&&saveTx()"></label>
  <datalist id="wl">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
  <div class="chips">${Object.keys(CAT[f.type]).map(c=>`<button class="chip ${c===f.cat?"on":""}" data-c="${c}" onclick="setCat('${c}')">${CAT[f.type][c][0]} ${c}</button>`).join("")}</div>
  <label>Note (optional)<input id="note" maxlength="60" placeholder="e.g. lunch" value="${esc(f.note)}" onkeydown="event.key==='Enter'&&saveTx()"></label>
  <label>Date<input id="date" type="date" value="${f.date}"></label>
  <button class="primary" onclick="saveTx()">${f.editId?"Update entry":"Save entry"}</button>
  ${f.editId?`<button class="ghost danger" onclick="delTx()">Delete entry</button><button class="ghost" onclick="cancelEdit()">Cancel</button>`:""}
  </div>
  <h2>Today <span>${tt.length} entries</span></h2>${list(tt)}`;
}
function whoPick(){
  const w=key($("#who").value);if(!w)return;
  const m=[...db.tx].reverse().find(x=>key(x.who)===w&&x.type===form.type);
  if(m){form.cat=m.cat;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.c===m.cat))}
}
function setType(t){draft();form.type=t;form.cat=Object.keys(CAT[t])[0];render()}
function setCat(c){draft();form.cat=c;render()}
function saveTx(){
  draft();
  const amount=parseFloat(String(form.amt).replace(/,/g,""));
  if(!(amount>0))return toast("Enter an amount greater than 0");
  const rec={type:form.type,amount,cat:form.cat,who:form.who.trim(),note:form.note.trim(),date:form.date||today()};
  const isEdit=!!form.editId;
  if(isEdit){const i=db.tx.findIndex(x=>x.id===form.editId);db.tx[i]={...db.tx[i],...rec}}
  else db.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...rec});
  save();form=blank(form.type,rec.date);toast(isEdit?"Entry updated":"Entry saved");render();
  if(!isEdit){const a=$("#amt");if(a)a.focus()}
}
function edit(id){const x=db.tx.find(t=>t.id===id);if(!x)return;form={type:x.type,cat:x.cat,editId:id,amt:String(x.amount),who:x.who||"",note:x.note||"",date:x.date};view="add";render();scrollTo(0,0)}
function cancelEdit(){form=blank(form.type);render()}
function delTx(){if(confirm("Delete this entry?")){db.tx=db.tx.filter(x=>x.id!==form.editId);save();form=blank(form.type);toast("Entry deleted");render()}}

/* ---------- Overview ---------- */
const mnav=()=>`<div class="mnav"><button onclick="goM(-1)">&lsaquo;</button><b>${mname(month)}</b><button onclick="goM(1)">&rsaquo;</button></div>`;
function goM(d){month=shift(month,d);render()}
function rOver(){
  const rows=db.tx.filter(x=>x.date.startsWith(month)),inc=incOf(month),exp=sum(rows,"expense"),net=inc-exp;
  const prev=sum(db.tx.filter(x=>x.date.startsWith(shift(month,-1))),"expense");
  const total=totalMoney(),goal=+db.set.saveGoal||0,[y,mo]=month.split("-").map(Number),dim=new Date(y,mo,0).getDate();
  const isNow=month===curM(),dayN=isNow?new Date().getDate():(month<curM()?dim:0),dl=dim-new Date().getDate()+1;
  const base=inc-goal,left=base-exp,dlim=base>0?base/dim:0;
  const ex=rows.filter(x=>x.type==="expense"),cats={},who={};
  ex.forEach(x=>{cats[x.cat]=(cats[x.cat]||0)+x.amount;if(x.who){const k=key(x.who);who[k]=who[k]||{n:x.who,v:0};who[k].v+=x.amount}});
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]),wl=Object.values(who).sort((a,b)=>b.v-a.v).slice(0,5);
  const daily=Array(dim).fill(0);ex.forEach(x=>{const d=+x.date.slice(8,10)-1;if(d>=0&&d<dim)daily[d]+=x.amount});
  const mx=Math.max(...daily,dlim,1),bw=300/dim;
  const bars=daily.map((v,i)=>`<rect x="${i*bw+1}" y="${70-v/mx*66}" width="${Math.max(bw-2,1)}" height="${v/mx*66}" rx="2" fill="${dlim>0&&v>dlim?"var(--exp)":"var(--acc)"}"/>`).join("")+(dlim>0?`<line x1="0" x2="300" y1="${70-dlim/mx*66}" y2="${70-dlim/mx*66}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1" opacity=".5"/>`:"");
  let status="No entries for this month yet.";
  if(inc>0||rows.length){
    status=(net>=0?`You are keeping ${inc>0?Math.round(net/inc*100):0}% of your income.`:`You spent ${money(-net)} more than you earned.`)
      +(isNow&&dayN>0&&exp>0?` At this pace you will save about ${money(inc-exp/dayN*dim)} by month end.`:"")
      +(prev>0&&exp>0?` Spending is ${exp>=prev?Math.round((exp/prev-1)*100)+"% higher":Math.round((1-exp/prev)*100)+"% lower"} than last month.`:"")
      +(wl[0]?` You paid ${wl[0].n} the most.`:"");
  }
  const pct=goal>0?Math.max(0,Math.min(100,net/goal*100)):0;
  const saveP=`<div class="panel"><small>Saved in ${mname(month)}</small><b class="${net<0?"expense":"income"}">${esc(cur())} ${money(net)}</b>${goal>0?`<small>Goal ${money(goal)}: ${net>=goal?"met":"short by "+money(goal-net)}</small><div class="bar"><i style="width:${pct}%;background:var(--inc)"></i></div>`:""}<small style="margin-top:8px">${status}</small></div>
  <div class="grid" style="margin-top:12px"><div class="panel"><small>Saved since you started</small><b class="income">${money(total-(+db.set.opening||0))}</b></div><div class="panel"><small>Savings rate</small><b>${inc>0?Math.round(net/inc*100):0}%</b></div></div>`;
  const plan=(salOf(month)>0||goal>0)?`<div class="panel"><small>Spending plan: income ${money(inc)} minus savings goal ${money(goal)}</small><b class="${left<0?"expense":""}">${left<0?"Over by "+money(-left):money(left)+" left to spend"}</b><div class="bar ${left<0?"over":""}"><i style="width:${base>0?Math.min(100,exp/base*100):100}%"></i></div>${isNow&&left>0?`<small style="margin-top:8px">About ${money(left/dl)} per day for the next ${dl} days.</small>`:""}</div>`:"";
  let cum=0;const dlog=daily.map((v,i)=>({d:i+1,v})).filter(r=>r.v>0).reverse().map(r=>`<li><div class="t"><b>${r.d} ${mname(month).split(" ")[0]}</b><small>${dlim>0?(r.v<=dlim?"Within daily limit":"Over limit by "+money(r.v-dlim)):"Spent that day"}</small></div><span class="${dlim>0&&r.v>dlim?"expense":"income"}">${money(r.v)}</span></li>`).join("");
  const six=[0,1,2,3,4,5].map(i=>shift(month,-i)).map(m=>{const n=incOf(m)-sum(db.tx.filter(x=>x.date.startsWith(m)),"expense");return`<li><div class="t"><b>${mname(m)}</b><small>${goal>0?(n>=goal?"Goal met":"Short by "+money(goal-n)):"Saved"}</small></div><span class="${n<0?"expense":"income"}">${money(n)}</span></li>`}).join("");
  $("#v-over").innerHTML=`${mnav()}
  <div class="hero"><small>Total money you have now</small><div class="big">${esc(cur())} ${money(total)}</div>
  <div class="pills"><div><small>Income</small><b>+ ${money(inc)}</b></div><div><small>Spent</small><b>- ${money(exp)}</b></div></div></div>
  ${saveP}${plan}
  <h2>Spending by day <span>${dlim>0?"dashed line: daily limit "+money(dlim):""}</span></h2><div class="panel"><svg viewBox="0 0 300 74">${bars}</svg></div>
  <h2>Day by day</h2>${dlog?`<ul>${dlog}</ul>`:'<p class="empty">No spending this month yet.</p>'}
  <h2>By category</h2><div class="panel">${cl.length?cl.map(([c,v])=>`<div class="row"><div><span>${(CAT.expense[c]||["📌"])[0]} ${esc(c)}</span><span>${money(v)}</span></div><div class="bar"><i style="width:${v/cl[0][1]*100}%;background:${(CAT.expense[c]||[0,"#8d99ae"])[1]}"></i></div></div>`).join(""):'<span class="empty">No expenses yet.</span>'}</div>
  <h2>Top names <span>who you paid most</span></h2><div class="panel">${wl.length?wl.map(p=>`<div class="row"><div><span>${esc(p.n)}</span><span>${money(p.v)}</span></div><div class="bar"><i style="width:${p.v/wl[0].v*100}%;background:${pcol(p.n)}"></i></div></div>`).join(""):'<span class="empty">Add a name to your expenses to see this.</span>'}</div>
  <h2>Last 6 months <span>saved</span></h2><ul>${six}</ul>`;
}

/* ---------- People ---------- */
function rPeople(){
  if(sel){
    const rows=db.tx.filter(x=>key(x.who)===sel),name=rows[0]?rows[0].who:sel,ex=rows.filter(x=>x.type==="expense");
    $("#v-ppl").innerHTML=`<button class="back" onclick="sel=null;render()">&lsaquo; All names</button><h1>${esc(name)}</h1>
    <div class="grid"><div class="panel"><small>Total paid</small><b class="expense">${money(sum(rows,"expense"))}</b></div><div class="panel"><small>Total received</small><b class="income">${money(sum(rows,"income"))}</b></div>
    <div class="panel"><small>Entries</small><b>${rows.length}</b></div><div class="panel"><small>Average payment</small><b>${money(ex.length?sum(rows,"expense")/ex.length:0)}</b></div></div>
    <button class="primary" onclick="addFor()">Add entry for ${esc(name)}</button>
    <h2>All entries</h2>${list(rows)}`;
    return;
  }
  $("#v-ppl").innerHTML=`<h1>People and shops</h1><input id="q" placeholder="Search names" oninput="pf()"><div id="pl" style="margin-top:12px"></div>`;pf();
}
function pf(){
  const q=key($("#q").value),m={};
  db.tx.forEach(x=>{if(!x.who)return;const k=key(x.who);m[k]=m[k]||{k,n:x.who,e:0,i:0,c:0,last:""};x.type==="expense"?m[k].e+=x.amount:m[k].i+=x.amount;m[k].c++;if(x.date>m[k].last)m[k].last=x.date});
  pl=Object.values(m).filter(p=>p.k.includes(q)).sort((a,b)=>(b.e+b.i)-(a.e+a.i));
  $("#pl").innerHTML=pl.length?`<ul>${pl.map((p,i)=>{const c=pcol(p.n);return`<li onclick="pick(${i})"><i class="av" style="background:${c}26;color:${c}">${esc(p.n[0].toUpperCase())}</i><div class="t"><b>${esc(p.n)}</b><small>${p.c} entries, last ${p.last}</small></div><span class="${p.e>0||!p.i?"expense":"income"}">${money(p.e>0||!p.i?p.e:p.i)}</span></li>`}).join("")}</ul>`:`<p class="empty">No names yet. Type who you paid when adding an expense and they will appear here.</p>`;
}
function pick(i){sel=pl[i].k;render();scrollTo(0,0)}
function addFor(){const r=db.tx.find(x=>key(x.who)===sel);form=blank("expense");form.who=r?r.who:"";const l=[...db.tx].reverse().find(x=>key(x.who)===sel&&x.type==="expense");if(l)form.cat=l.cat;view="add";render();scrollTo(0,0)}

/* ---------- History ---------- */
function rHist(){$("#v-hist").innerHTML=`${mnav()}<input id="q" placeholder="Search names, notes or categories" oninput="hl()"><div id="hl"></div>`;hl()}
function hl(){
  const q=$("#q").value.toLowerCase(),rows=db.tx.filter(x=>x.date.startsWith(month)&&((x.who||"")+" "+(x.note||"")+" "+x.cat).toLowerCase().includes(q));
  const days=[...new Set(rows.map(x=>x.date))].sort().reverse();
  $("#hl").innerHTML=days.length?days.map(d=>{const r=rows.filter(x=>x.date===d);return`<h2>${new Date(d+"T00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}<span>${money(sum(r,"expense"))} spent</span></h2>${list(r)}`}).join(""):`<p class="empty">No transactions found.</p>`;
}

/* ---------- Settings ---------- */
function rSet(){
  $("#v-set").innerHTML=`<h1>Settings</h1><div class="panel">
  <label>Currency label<input id="s-cur" value="${esc(cur())}" maxlength="5"></label>
  <label>Monthly salary (added automatically every month)<input id="s-sal" inputmode="decimal" value="${db.set.salary||""}" placeholder="0"></label>
  <label>First salary month<input id="s-start" type="month" value="${startM()}"></label>
  <label>Monthly savings goal<input id="s-goal" inputmode="decimal" value="${db.set.saveGoal||""}" placeholder="0"></label>
  <label>Money you had before that month (opening balance)<input id="s-open" inputmode="decimal" value="${db.set.opening||""}" placeholder="0"></label>
  <button class="primary" onclick="saveSet()">Save settings</button>
  <p class="empty" style="padding:12px 0 0">Do not enter your salary as an income entry, it is added for you. Use Income entries only for extra money such as bonuses.</p></div>
  <h2>Backup</h2>
  <button class="ghost" onclick="exp('json')">Download backup (JSON)</button>
  <button class="ghost" onclick="exp('csv')">Download spreadsheet (CSV)</button>
  <button class="ghost" onclick="$('#file').click()">Restore from backup</button>
  <input id="file" type="file" accept=".json" hidden onchange="imp(event)">
  <button class="ghost danger" onclick="wipe()">Delete all data</button>
  <p class="empty">Your data is stored only in this browser on this device. Download a backup every week.</p>`;
}
function saveSet(){db.set={cur:$("#s-cur").value.trim()||"LKR",salary:parseFloat($("#s-sal").value)||0,start:$("#s-start").value||curM(),saveGoal:parseFloat($("#s-goal").value)||0,opening:parseFloat($("#s-open").value)||0};save();toast("Settings saved")}
function exp(k){
  let c,n,t;
  if(k==="json"){c=JSON.stringify(db,null,1);n="money-backup-"+today()+".json";t="application/json"}
  else{const q=s=>'"'+(s||"").replace(/"/g,'""')+'"';c="date,type,category,paid to or from,amount,note\n"+[...db.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type,x.cat,q(x.who),x.amount,q(x.note)].join(",")).join("\n");n="money-"+today()+".csv";t="text/csv"}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();
}
function imp(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;if(!confirm("Replace current data with this backup?"))return;db={tx:d.tx,set:d.set||{}};save();render();toast("Backup restored")}catch(x){toast("That file is not a valid backup")}};
  r.readAsText(f);
}
function wipe(){if(confirm("Delete ALL entries and settings? This cannot be undone.")){db={tx:[],set:{}};save();render();toast("All data deleted")}}
render();
</script>
</body>
</html>
